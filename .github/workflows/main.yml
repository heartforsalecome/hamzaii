name: Windows 10 RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_auth_token:
        description: "Enter your ngrok auth token"
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. INSTALL LATEST NGROK
      # ============================================================
      - name: Install latest ngrok
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "INSTALLING LATEST NGROK"
          Write-Host "======================================"

          $zip = "$env:TEMP\ngrok.zip"
          $extract = "$env:TEMP\ngrok"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Downloading ngrok..."

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "ngrok download failed."
          }

          Write-Host "Extracting ngrok..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $ngrokPath = Join-Path $extract "ngrok.exe"

          if (-not (Test-Path $ngrokPath)) {
            throw "ngrok.exe was not found."
          }

          Copy-Item `
            $ngrokPath `
            "C:\Windows\System32\ngrok.exe" `
            -Force

          Write-Host ""
          Write-Host "ngrok version:"
          & "C:\Windows\System32\ngrok.exe" version

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok executable failed."
          }


      # ============================================================
      # 2. CONFIGURE NGROK
      # ============================================================
      - name: Configure ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ inputs.ngrok_auth_token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "CONFIGURING NGROK"
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            throw "ngrok auth token is empty."
          }

          & "C:\Windows\System32\ngrok.exe" `
            config add-authtoken `
            "$env:NGROK_AUTH_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication failed."
          }

          Write-Host "ngrok authentication successful."


      # ============================================================
      # 3. START TCP FIRST + CONFIGURE RDP
      #
      # IMPORTANT:
      # ngrok and RDP are handled inside THE SAME STEP.
      # This prevents GitHub from killing ngrok between steps.
      # ============================================================
      - name: Start TCP and configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ngrokExe = "C:\Windows\System32\ngrok.exe"
          $ngrokStdout = "$env:TEMP\ngrok-stdout.log"
          $ngrokStderr = "$env:TEMP\ngrok-stderr.log"

          Remove-Item `
            $ngrokStdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $ngrokStderr `
            -Force `
            -ErrorAction SilentlyContinue


          # ========================================================
          # START NGROK FIRST
          # ========================================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "STARTING TCP TUNNEL FIRST"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "RDP has NOT been configured yet."
          Write-Host "Starting ngrok TCP tunnel on port 3389..."
          Write-Host ""

          $ngrokProcess = Start-Process `
            -FilePath $ngrokExe `
            -ArgumentList @(
              "tcp",
              "3389",
              "--log=stdout"
            ) `
            -RedirectStandardOutput $ngrokStdout `
            -RedirectStandardError $ngrokStderr `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "ngrok PID: $($ngrokProcess.Id)"
          Write-Host ""

          # ========================================================
          # WAIT FOR TCP ENDPOINT
          # ========================================================

          $tunnelUrl = $null

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            if ($ngrokProcess.HasExited) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "NGROK STOPPED"
              Write-Host "======================================"

              if (Test-Path $ngrokStdout) {
                Write-Host ""
                Write-Host "NGROK STDOUT:"
                Get-Content $ngrokStdout
              }

              if (Test-Path $ngrokStderr) {
                Write-Host ""
                Write-Host "NGROK STDERR:"
                Get-Content $ngrokStderr
              }

              throw "ngrok stopped before creating the TCP tunnel."
            }

            try {

              $api = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -TimeoutSec 3

              $tcpTunnel = $api.tunnels |
                Where-Object {
                  $_.proto -eq "tcp"
                } |
                Select-Object -First 1

              if ($tcpTunnel) {
                $tunnelUrl = $tcpTunnel.public_url
                break
              }

            }
            catch {
              # ngrok API is not ready yet
            }

            Write-Host "Waiting for TCP endpoint... ($i/30)"
          }


          # ========================================================
          # CHECK TCP ENDPOINT
          # ========================================================

          if ([string]::IsNullOrWhiteSpace($tunnelUrl)) {

            Write-Host ""
            Write-Host "======================================"
            Write-Host "TCP TUNNEL FAILED"
            Write-Host "======================================"

            if (Test-Path $ngrokStdout) {
              Write-Host ""
              Write-Host "NGROK STDOUT:"
              Get-Content $ngrokStdout
            }

            if (Test-Path $ngrokStderr) {
              Write-Host ""
              Write-Host "NGROK STDERR:"
              Get-Content $ngrokStderr
            }

            throw "ngrok did not provide a TCP address."
          }


          # ========================================================
          # TCP ADDRESS AVAILABLE
          # ========================================================

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          TCP TUNNEL IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "TCP ADDRESS:"
          Write-Host $tunnelUrl
          Write-Host ""
          Write-Host "ngrok is STILL RUNNING."
          Write-Host ""
          Write-Host "Now configuring Windows RDP..."
          Write-Host ""


          # ========================================================
          # ENABLE REMOTE DESKTOP
          # ========================================================

          Write-Host "======================================"
          Write-Host "ENABLING REMOTE DESKTOP"
          Write-Host "======================================"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          Write-Host "Remote Desktop service configured."


          # ========================================================
          # CREATE RDP USER
          # ========================================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CONFIGURING RDP USER"
          Write-Host "======================================"

          $username = "runneradmin"
          $passwordText = "Riders004@123"

          $securePassword = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

            Write-Host "Created user: $username"

          }
          else {

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Write-Host "Updated password for: $username"
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


          # ========================================================
          # VERIFY RDP PORT
          # ========================================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "VERIFYING RDP PORT 3389"
          Write-Host "======================================"

          $rdpReady = $false

          for ($i = 1; $i -le 15; $i++) {

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $rdpReady = $true
              break
            }

            Write-Host "Waiting for RDP listener... ($i/15)"
            Start-Sleep -Seconds 2
          }

          if (-not $rdpReady) {

            Write-Host ""
            Write-Host "RDP port 3389 is NOT listening."

            Get-Service TermService |
              Select-Object Name, Status, StartType

            throw "RDP port 3389 failed to start."
          }


          # ========================================================
          # GPU CHECK
          # ========================================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "GPU CHECK"
          Write-Host "======================================"

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              AdapterRAM,
              DriverVersion |
            Format-List


          # ========================================================
          # FINAL CONNECTION INFORMATION
          # ========================================================

          Write-Host ""
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              WINDOWS RDP READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "TCP ADDRESS:"
          Write-Host $tunnelUrl
          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host "runneradmin"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "Riders004@123"
          Write-Host ""
          Write-Host "RDP PORT:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "       USE THE TCP ADDRESS IN YOUR RDP APP"
          Write-Host "=================================================="
          Write-Host ""


          # ========================================================
          # KEEP EVERYTHING ALIVE
          #
          # IMPORTANT:
          # ngrok remains inside THIS SAME GITHUB STEP.
          # ========================================================

          while ($true) {

            if ($ngrokProcess.HasExited) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "ERROR: NGROK STOPPED"
              Write-Host "======================================"

              if (Test-Path $ngrokStdout) {
                Write-Host ""
                Write-Host "NGROK STDOUT:"
                Get-Content $ngrokStdout
              }

              if (Test-Path $ngrokStderr) {
                Write-Host ""
                Write-Host "NGROK STDERR:"
                Get-Content $ngrokStderr
              }

              exit 1
            }

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if (-not $listener) {

              Write-Host ""
              Write-Host "WARNING: RDP port 3389 is no longer listening."

            }

            Write-Host ""
            Write-Host "$(Get-Date -Format 'HH:mm:ss') - RDP + ngrok ACTIVE"
            Write-Host "TCP: $tunnelUrl"

            Start-Sleep -Seconds 30
          }
