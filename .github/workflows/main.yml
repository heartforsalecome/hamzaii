name: Windows 10 RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_auth_token:
        description: "Enter your ngrok auth token"
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Install ngrok
        shell: pwsh
        run: |
          Write-Host "Installing ngrok..."

          winget install ngrok.ngrok `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements

          Write-Host "ngrok installation completed."

      - name: Locate ngrok
        shell: pwsh
        run: |
          $paths = @(
            "$env:LOCALAPPDATA\Microsoft\WinGet\Packages",
            "$env:ProgramFiles\ngrok",
            "$env:ChocolateyInstall\bin"
          )

          $ngrok = Get-Command ngrok.exe -ErrorAction SilentlyContinue

          if ($ngrok) {
            Write-Host "ngrok found at:"
            Write-Host $ngrok.Source
            exit 0
          }

          $found = Get-ChildItem `
            -Path $paths `
            -Filter "ngrok.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($found) {
            Write-Host "ngrok found at:"
            Write-Host $found.FullName

            "NGROK_DIR=$($found.DirectoryName)" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append

            exit 0
          }

          throw "ngrok.exe could not be found."

      - name: Configure ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ inputs.ngrok_auth_token }}
        run: |
          $ngrok = Get-Command ngrok.exe -ErrorAction SilentlyContinue

          if ($ngrok) {
            $ngrokPath = $ngrok.Source
          }
          elseif ($env:NGROK_DIR) {
            $ngrokPath = Join-Path $env:NGROK_DIR "ngrok.exe"
          }
          else {
            throw "ngrok executable not found."
          }

          Write-Host "Using ngrok:"
          Write-Host $ngrokPath

          & $ngrokPath config add-authtoken "$env:NGROK_AUTH_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication failed."
          }

          Write-Host "ngrok authentication successful."

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "Remote Desktop enabled."

      - name: Configure RDP User
        shell: pwsh
        run: |
          $username = "runneradmin"
          $passwordText = "Riders004@123"

          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {
            New-LocalUser `
              -Name $username `
              -Password $password `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

            Write-Host "Created RDP user."
          }
          else {
            Set-LocalUser `
              -Name $username `
              -Password $password

            Write-Host "Updated RDP user password."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "===== RDP SERVICE ====="

          Get-Service TermService |
            Select-Object Name, Status, StartType

          Write-Host ""
          Write-Host "===== PORT 3389 ====="

          $connection = Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if ($connection) {
            $connection |
              Select-Object LocalAddress, LocalPort, State
          }
          else {
            Write-Host "No listener detected yet."
          }

      - name: Check GPU
        shell: pwsh
        run: |
          Write-Host "===== GPU CHECK ====="

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              AdapterRAM,
              DriverVersion |
            Format-List

      - name: Start ngrok RDP Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ inputs.ngrok_auth_token }}
        run: |
          $ngrok = Get-Command ngrok.exe -ErrorAction SilentlyContinue

          if ($ngrok) {
            $ngrokPath = $ngrok.Source
          }
          elseif ($env:NGROK_DIR) {
            $ngrokPath = Join-Path $env:NGROK_DIR "ngrok.exe"
          }
          else {
            throw "ngrok executable not found."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS RDP READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "RDP Username: runneradmin"
          Write-Host "RDP Password: Riders004@123"
          Write-Host ""
          Write-Host "Starting ngrok TCP tunnel on port 3389..."
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

          & $ngrokPath tcp 3389
