name: Windows 10 RDP

on:
  workflow_dispatch:
    inputs:
      ngrok_auth_token:
        description: "Enter your ngrok auth token"
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      - name: Install latest ngrok
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "Installing latest ngrok"
          Write-Host "======================================"

          $ErrorActionPreference = "Stop"

          # Remove any old ngrok installation
          winget uninstall ngrok --silent `
            --accept-source-agreements `
            --disable-interactivity `
            2>$null

          # Install from Microsoft Store source
          winget install ngrok `
            --source msstore `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          # Refresh PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable(
            "Path",
            "Machine"
          ) + ";" + [System.Environment]::GetEnvironmentVariable(
            "Path",
            "User"
          )

          $ngrok = Get-Command ngrok.exe `
            -ErrorAction SilentlyContinue

          if (-not $ngrok) {
            throw "ngrok.exe was not found after installation."
          }

          Write-Host ""
          Write-Host "ngrok location:"
          Write-Host $ngrok.Source

          Write-Host ""
          Write-Host "ngrok version:"
          & $ngrok.Source version

      - name: Verify ngrok version
        shell: pwsh
        run: |
          $ngrok = Get-Command ngrok.exe `
            -ErrorAction Stop

          Write-Host "Using:"
          Write-Host $ngrok.Source

          $versionOutput = & $ngrok.Source version

          Write-Host $versionOutput

          if ($versionOutput -match "3\.(\d+)\.") {
            $minor = [int]$Matches[1]

            if ($minor -lt 20) {
              throw "ngrok version is too old. Minimum required version is 3.20.0."
            }
          }

      - name: Configure ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ inputs.ngrok_auth_token }}
        run: |
          $ngrok = Get-Command ngrok.exe `
            -ErrorAction Stop

          Write-Host "Configuring ngrok..."

          & $ngrok.Source `
            config add-authtoken `
            "$env:NGROK_AUTH_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "ngrok authentication failed."
          }

          Write-Host "ngrok authentication successful."

      - name: Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Write-Host "Remote Desktop enabled."

      - name: Configure RDP user
        shell: pwsh
        run: |
          $username = "runneradmin"
          $passwordText = "Riders004@123"

          $password = ConvertTo-SecureString `
            $passwordText `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

            New-LocalUser `
              -Name $username `
              -Password $password `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword

            Write-Host "Created runneradmin."

          } else {

            Set-LocalUser `
              -Name $username `
              -Password $password

            Write-Host "Updated runneradmin password."
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "RDP SERVICE"
          Write-Host "======================================"

          Get-Service TermService |
            Select-Object Name, Status, StartType

          Write-Host ""
          Write-Host "======================================"
          Write-Host "PORT 3389"
          Write-Host "======================================"

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
            $listener |
              Select-Object LocalAddress, LocalPort, State

            Write-Host ""
            Write-Host "RDP port 3389 is listening."
          }
          else {
            throw "RDP port 3389 is NOT listening."
          }

      - name: Check GPU
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host "GPU CHECK"
          Write-Host "======================================"

          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              AdapterRAM,
              DriverVersion |
            Format-List

      - name: Start ngrok TCP tunnel
        shell: pwsh
        run: |
          $ngrok = Get-Command ngrok.exe `
            -ErrorAction Stop

          Write-Host ""
          Write-Host "======================================"
          Write-Host "WINDOWS RDP READY"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Username: runneradmin"
          Write-Host "Password: Riders004@123"
          Write-Host ""
          Write-Host "Starting ngrok TCP tunnel..."
          Write-Host ""
          Write-Host "======================================"
          Write-Host ""

          & $ngrok.Source tcp 3389
